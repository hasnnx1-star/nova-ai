<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova AI — Your Intelligent Companion</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy: #0A0F2C;
      --navy-mid: #111936;
      --navy-light: #1A2444;
      --gold: #C9A84C;
      --gold-light: #E8C97A;
      --gold-pale: #F5E9C8;
      --white: #F8F6F0;
      --text-muted: #8A93B2;
      --border: rgba(201,168,76,0.15);
      --user-bubble: linear-gradient(135deg, #C9A84C, #E8C97A);
      --bot-bubble: #1A2444;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--navy);
      color: var(--white);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 20% 20%, rgba(201,168,76,0.06) 0%, transparent 70%),
        radial-gradient(ellipse 50% 60% at 80% 80%, rgba(26,36,68,0.8) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: var(--gold);
      border-radius: 50%;
      opacity: 0;
      animation: twinkle var(--d) var(--delay) infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0; transform: scale(0.5); }
      50% { opacity: 0.4; transform: scale(1); }
    }

    .app {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      height: 100vh;
      max-height: 760px;
      display: flex;
      flex-direction: column;
      background: var(--navy-mid);
      border: 1px solid var(--border);
      border-radius: 24px;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(201,168,76,0.08),
        0 40px 80px rgba(0,0,0,0.6),
        inset 0 1px 0 rgba(201,168,76,0.1);
      animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header {
      padding: 20px 24px 18px;
      background: linear-gradient(180deg, rgba(201,168,76,0.08) 0%, transparent 100%);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }

    .logo {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: linear-gradient(135deg, #C9A84C, #E8C97A);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--navy);
      flex-shrink: 0;
      box-shadow: 0 4px 16px rgba(201,168,76,0.3);
    }

    .header-info { flex: 1; }

    .header-name {
      font-family: 'Playfair Display', serif;
      font-size: 18px;
      font-weight: 600;
      color: var(--gold-light);
      letter-spacing: 0.01em;
    }

    .header-tagline {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
      font-weight: 300;
      letter-spacing: 0.03em;
    }

    .status-dot {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #5DCAA5;
      font-weight: 500;
    }

    .status-dot::before {
      content: '';
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #5DCAA5;
      box-shadow: 0 0 8px #5DCAA5;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 20px 10px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .msg-wrap {
      display: flex;
      flex-direction: column;
      animation: msgIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-wrap.user { align-items: flex-end; }
    .msg-wrap.bot { align-items: flex-start; }

    .msg {
      max-width: 78%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.6;
      font-weight: 400;
    }

    .msg.user {
      background: var(--user-bubble);
      color: var(--navy);
      font-weight: 500;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 16px rgba(201,168,76,0.2);
    }

    .msg.bot {
      background: var(--bot-bubble);
      color: var(--white);
      border-bottom-left-radius: 4px;
      border: 1px solid rgba(201,168,76,0.1);
      white-space: pre-wrap;
    }

    .msg-label {
      font-size: 10px;
      color: var(--text-muted);
      margin-bottom: 5px;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 0 4px;
    }

    .typing-wrap {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      animation: msgIn 0.3s both;
    }

    .typing {
      background: var(--bot-bubble);
      border: 1px solid rgba(201,168,76,0.1);
      padding: 14px 18px;
      border-radius: 18px;
      border-bottom-left-radius: 4px;
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .typing span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--gold);
      animation: typingBounce 1.2s infinite;
      opacity: 0.6;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-6px); opacity: 1; }
    }

    .welcome {
      text-align: center;
      padding: 20px 10px;
      animation: msgIn 0.5s both;
    }

    .welcome-icon {
      width: 56px;
      height: 56px;
      border-radius: 18px;
      background: linear-gradient(135deg, #C9A84C, #E8C97A);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Playfair Display', serif;
      font-size: 24px;
      font-weight: 700;
      color: var(--navy);
      margin: 0 auto 14px;
      box-shadow: 0 8px 24px rgba(201,168,76,0.3);
    }

    .welcome h3 {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      color: var(--gold-light);
      margin-bottom: 8px;
    }

    .welcome p {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.6;
      max-width: 280px;
      margin: 0 auto 18px;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .suggestion {
      font-size: 12px;
      padding: 7px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--gold);
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.2s;
    }

    .suggestion:hover {
      background: rgba(201,168,76,0.1);
      border-color: var(--gold);
    }

    .input-area {
      padding: 14px 16px 18px;
      border-top: 1px solid var(--border);
      background: rgba(10,15,44,0.5);
      flex-shrink: 0;
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: center;
      background: var(--navy-light);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 8px 8px 8px 16px;
      transition: border-color 0.2s;
    }

    .input-row:focus-within {
      border-color: rgba(201,168,76,0.4);
      box-shadow: 0 0 0 3px rgba(201,168,76,0.05);
    }

    .input-row input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-size: 14px;
      color: var(--white);
      font-family: 'DM Sans', sans-serif;
      font-weight: 400;
    }

    .input-row input::placeholder { color: var(--text-muted); }

    .send-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #C9A84C, #E8C97A);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
      box-shadow: 0 2px 8px rgba(201,168,76,0.3);
    }

    .send-btn:hover { transform: scale(1.05); box-shadow: 0 4px 16px rgba(201,168,76,0.4); }
    .send-btn:active { transform: scale(0.95); }

    .send-btn svg { width: 15px; height: 15px; fill: var(--navy); }

    .input-hint {
      text-align: center;
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 8px;
      letter-spacing: 0.03em;
    }

    .input-hint span { color: var(--gold); opacity: 0.7; }
  </style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="app">
  <div class="header">
    <div class="logo">N</div>
    <div class="header-info">
      <div class="header-name">Nova AI</div>
      <div class="header-tagline">Your intelligent companion, always ready to help</div>
    </div>
    <div class="status-dot">Online</div>
  </div>

  <div class="messages" id="messages">
    <div class="welcome">
      <div class="welcome-icon">N</div>
      <h3>Hello, I'm Nova</h3>
      <p>Your intelligent AI companion. Ask me anything — coding, crypto, science, business, health, or anything else!</p>
      <div class="suggestions">
        <button class="suggestion" onclick="quickAsk('What is Bitcoin and how do I start trading?')">₿ Crypto Trading</button>
        <button class="suggestion" onclick="quickAsk('Write me a Python script to check Bitcoin price')">🐍 Python Code</button>
        <button class="suggestion" onclick="quickAsk('How do I start a successful online business?')">💼 Business</button>
        <button class="suggestion" onclick="quickAsk('Tell me something amazing about space')">🚀 Science</button>
      </div>
    </div>
  </div>

  <div class="input-area">
    <div class="input-row">
      <input type="text" id="userInput" placeholder="Ask Nova anything..." onkeypress="if(event.key==='Enter') sendMessage()">
      <button class="send-btn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
      </button>
    </div>
    <div class="input-hint">Powered by <span>Nova AI</span> · Built by You 🚀</div>
  </div>
</div>

<script>
  const starsContainer = document.getElementById('stars');
  for (let i = 0; i < 60; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.style.cssText = `
      left: ${Math.random() * 100}%;
      top: ${Math.random() * 100}%;
      --d: ${2 + Math.random() * 4}s;
      --delay: ${Math.random() * 4}s;
    `;
    starsContainer.appendChild(star);
  }

  function quickAsk(text) {
    document.getElementById('userInput').value = text;
    sendMessage();
  }

  async function sendMessage() {
    const input = document.getElementById('userInput');
    const messages = document.getElementById('messages');
    const text = input.value.trim();
    if (!text) return;

    const welcome = messages.querySelector('.welcome');
    if (welcome) welcome.remove();

    const userWrap = document.createElement('div');
    userWrap.className = 'msg-wrap user';
    userWrap.innerHTML = `<div class="msg-label">You</div><div class="msg user">${text}</div>`;
    messages.appendChild(userWrap);
    input.value = '';

    const typingWrap = document.createElement('div');
    typingWrap.className = 'typing-wrap';
    typingWrap.id = 'typing';
    typingWrap.innerHTML = `<div class="msg-label">Nova</div><div class="typing"><span></span><span></span><span></span></div>`;
    messages.appendChild(typingWrap);
    messages.scrollTop = messages.scrollHeight;

    try {
      const response = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });
      const data = await response.json();
      document.getElementById('typing').remove();

      const botWrap = document.createElement('div');
      botWrap.className = 'msg-wrap bot';
      botWrap.innerHTML = `<div class="msg-label">Nova</div><div class="msg bot">${data.reply}</div>`;
      messages.appendChild(botWrap);
    } catch (error) {
      document.getElementById('typing').remove();
      const errWrap = document.createElement('div');
      errWrap.className = 'msg-wrap bot';
      errWrap.innerHTML = `<div class="msg-label">Nova</div><div class="msg bot">Sorry, I took too long! Please try again.</div>`;
      messages.appendChild(errWrap);
    }
    messages.scrollTop = messages.scrollHeight;
  }
</script>
</body>
</html>
